# Plan §14: Docker Compose with Nginx HTTPS/WSS proxy, NestJS API, market worker,
# notification worker, outbox dispatcher, PostgreSQL and Redis.
#
#   cp .env.example .env            # set JWT_SECRET etc.
#   docker compose up -d --build    # local (API on http://localhost:3000)
#   docker compose --profile https up -d --build   # + Nginx on 443 (see nginx/README.md)

x-app: &app
  build:
    context: .
    target: runtime
  image: crypto-alerts-backend:latest
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-alerts}:${POSTGRES_PASSWORD:-alerts}@postgres:5432/${POSTGRES_DB:-crypto_alerts}?schema=public
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alerts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerts}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_alerts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so queued notification jobs survive a Redis restart; BullMQ needs noeviction.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alerts}:${POSTGRES_PASSWORD:-alerts}@postgres:5432/${POSTGRES_DB:-crypto_alerts}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    command: ["node", "dist/main.js"]
    environment:
      NODE_ENV: production
      APP_ROLE: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-alerts}:${POSTGRES_PASSWORD:-alerts}@postgres:5432/${POSTGRES_DB:-crypto_alerts}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  market-worker:
    <<: *app
    command: ["node", "dist/workers/market.worker.js"]
    healthcheck:
      test: ["CMD", "node", "dist/workers/healthcheck.js", "market"]
      interval: 15s
      timeout: 5s
      retries: 4

  outbox-dispatcher:
    <<: *app
    command: ["node", "dist/workers/outbox.worker.js"]
    healthcheck:
      test: ["CMD", "node", "dist/workers/healthcheck.js", "outbox"]
      interval: 15s
      timeout: 5s
      retries: 4

  notification-worker:
    <<: *app
    command: ["node", "dist/workers/notification.worker.js"]
    healthcheck:
      test: ["CMD", "node", "dist/workers/healthcheck.js", "notifications"]
      interval: 15s
      timeout: 5s
      retries: 4

  nginx:
    image: nginx:1.27-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/acme:/var/www/acme:ro

volumes:
  pgdata:
  redisdata:
