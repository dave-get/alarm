# Render Blueprint for the Crypto Price Alert backend.
# Dashboard: New + > Blueprint > pick this repo. Render reads this file from the repo root.
#
# Region is Frankfurt on purpose: Binance.com rejects connections from US IP addresses
# (HTTP 451), so the market feed would never connect from Render's US regions.

services:
  # One web service runs every process role (APP_ROLE=all): REST API + Socket.IO,
  # Binance ingestion + alert engine, outbox dispatcher and push worker.
  # Safe to scale out: a Redis lease keeps a single market-data leader,
  # the outbox uses SKIP LOCKED and BullMQ workers share the queue.
  - type: web
    name: crypto-alerts-api
    runtime: node
    region: frankfurt
    # Must be a paid instance: free web services sleep after 15 minutes without
    # HTTP traffic, which would stop price monitoring and alarm notifications.
    plan: starter
    rootDir: backend
    buildCommand: npm run render:build
    # render:build also runs `prisma migrate deploy` (uses DIRECT_URL), because free
    # instances skip preDeployCommand. Running it twice is harmless: it is idempotent.
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: APP_ROLE
        value: all
      # Neon pooled connection (host contains "-pooler"). Set in the dashboard, never in git.
      - key: DATABASE_URL
        sync: false
      # Neon direct connection (same URL without "-pooler"), used only by prisma migrate.
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: crypto-alerts-redis
          property: connectionString
      # Random 256-bit secret generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: SWAGGER_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_JSON
        value: "true"
      # Browser origins only; the native mobile app does not need CORS.
      - key: CORS_ORIGINS
        value: ""
      # Only needed if "Enhanced push security" is enabled in your Expo project.
      - key: EXPO_ACCESS_TOKEN
        sync: false

  # Redis-compatible store for latest prices, pub/sub, rate limits and BullMQ.
  - type: keyvalue
    name: crypto-alerts-redis
    region: frankfurt
    # Use a paid plan in production: the free plan has no persistence, so queued
    # notification jobs would be lost on a restart.
    plan: starter
    # BullMQ requires noeviction (evicted job keys corrupt the queue).
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal access only (from your Render services)
